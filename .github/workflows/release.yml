# Releases the mod: a tag <slug>-v<version> on release builds it, checks the version against its meitou.json, and publishes
# <MOD_FOLDER>-<version>.zip (with its SHA-256) holding the folder to drop into Kenshi/mods/. Packaging: GutenStructure
# package-meitou-mod.yml (pinned). Rename ExampleMod / example-mod below with the mod (README "Use this template").
name: Release

on:
  push:
    tags: ["example-mod-v*"]

permissions:
  contents: read

jobs:
  release-gate:
    permissions:
      contents: read
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/release-gate.yml@d3e8fc332da625ed8dc092909120e9360be660c7

  release:
    needs: release-gate
    permissions:
      contents: write
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/package-meitou-mod.yml@d3e8fc332da625ed8dc092909120e9360be660c7
    with:
      mod-folder: ExampleMod
      slug: example-mod
      channel: release
      test-project: .
      # true for a code mod without data: the zip gets an empty ExampleMod.mod. false when <Mod>.Data generates one.
      empty-data-mod: true
