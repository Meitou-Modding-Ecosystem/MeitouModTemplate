# Publishes ExampleMod from beta as GitHub prereleases on every merge, so each upstream Meitou build the engine moves to (engine-update.yml)
# has a matching mod build to play: example-mod-<version>-beta.<commit> (never moved) and rolling example-mod-beta (ExampleMod-beta.zip).
# Packaging: GutenStructure package-meitou-mod.yml, pinned to a commit that packs items/ and imported models.
name: Beta prerelease

on:
  push:
    branches: [beta]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta:
    # The template itself publishes nothing; a repository created from it does.
    if: github.ref == 'refs/heads/beta' && github.repository != 'Meitou-Modding-Ecosystem/MeitouModTemplate'
    permissions:
      contents: write
    uses: TheIvoryDisaster/GutenStructure/.github/workflows/package-meitou-mod.yml@18f67b9121d10d27530bb45916e338f4e159eaa1
    with:
      mod-folder: ExampleMod
      slug: example-mod
      channel: beta
      test-project: .
      empty-data-mod: true
